name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '17']
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - name: Show build environment
        run: |
          java -version
          mvn -version
      # 只跑到 test：maven-gpg-plugin 的 sign-artifacts 绑在 verify 阶段，
      # 跑 verify/package 会要求签名密钥
      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress clean test
